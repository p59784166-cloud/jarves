name: Validate JARVES


on:
  push:
    branches: ['**']
    paths:
      - 'ai/**'
      - 'android/**'
      - 'backend/**'
      - 'database/**'
      - 'desktop/**'
      - 'executor/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'ai/**'
      - 'android/**'
      - 'backend/**'
      - 'database/**'
      - 'desktop/**'
      - 'executor/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'


permissions:
  contents: read

