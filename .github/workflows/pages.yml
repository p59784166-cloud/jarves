name: Publish JARVES downloads site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/download.html'
      - 'frontend/assets/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare downloads page
        run: |
          mkdir -p public/assets
          cp frontend/download.html public/index.html
          cp frontend/assets/icon-192.png public/assets/icon-192.png
          cp frontend/assets/icon-512.png public/assets/icon-512.png
          cp frontend/assets/JERVER_AI_V1000_ICON_ARTWORK.png public/assets/JERVER_AI_V1000_ICON_ARTWORK.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
